name: dispense practice case

# Manually triggered: opens a PR that "assigns" you a case for review.
# The PR contains the case ticket + bad code; you respond by committing fixes
# and filling the review template; the grading workflow scores you.

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Case folder name (leave blank for random)"
        required: false
        type: choice
        options:
          - case-01-model-loading
          - case-02-data-pipeline
          - case-03-llm-batch-job
          - case-04-training-script
          - case-05-feature-serving
          - case-06-project-hygiene
          - case-07-sklearn-preprocessing
          - case-08-pandas-indexing
          - case-09-numpy-broadcasting
          - case-10-seaborn-monitoring
          - case-11-batch-inference-queue
          - case-12-feature-freshness
          - case-13-data-contract-drift
          - case-14-distributed-training
          - case-15-workflow-idempotency
          - case-16-canary-deployment
          - case-17-streaming-inference
          - case-18-pii-observability
          - case-19-hyperparameter-search
          - case-20-gpu-serving
          - case-21-point-in-time-features
          - case-22-llm-gateway
          - case-23-retraining-orchestrator
          - case-24-statistical-rollback
          - case-25-distributed-join
          - case-26-model-supply-chain
          - case-27-event-time-streaming
          - case-28-fairness-calibration
          - case-29-ensemble-hedging
          - case-30-artifact-hot-reload

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create practice branch
        run: |
          CASE="${{ github.event.inputs.case }}"
          STAMP=$(date +%Y%m%d-%H%M)
          BRANCH="practice/$CASE-$STAMP"
          git config user.email github-actions@github.com
          git config user.name github-actions
          git checkout -b "$BRANCH"
          # touch-freeze marker so the PR has a commit ahead of main
          echo "practice attempt: $STAMP" >> cases/$CASE/ATTEMPTS.md
          git add cases/$CASE/ATTEMPTS.md
          git commit -m "practice: start attempt on $CASE ($STAMP)"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"
          echo "case=$CASE" >> "$GITHUB_ENV"

      - name: Open the practice PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed "s/__CASE__/${{ env.case }}/g" .github/practice_pr_template.md > /tmp/pr_body.md
          gh pr create \
            --title "Practice review: ${{ env.case }}" \
            --body-file /tmp/pr_body.md \
            --base main
